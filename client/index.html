<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAS Laptop Diagnostic - فحص جهاز اللابتوب</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/client.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <script src="../js/errorHandler.js"></script>
</head>
<body class="client-body">
    <div class="client-container">
        <!-- Header -->
        <header class="client-header">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="4" width="36" height="24" rx="2" stroke="currentColor" stroke-width="2"/>
                    <rect x="6" y="30" width="28" height="4" rx="1" stroke="currentColor" stroke-width="2"/>
                    <rect x="6" y="8" width="28" height="16" rx="1" stroke="currentColor" stroke-width="1.5"/>
                </svg>
                <span class="logo-text">YAS Diagnostic</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="client-main">
            <div class="client-content">
                <div class="client-hero">
                    <h1 class="client-title">فحص جهاز اللابتوب</h1>
                    <p class="client-description">
                        سيقوم النظام بفحص الجهاز تلقائيًا والتحقق من مجموعة من وظائف ومكونات الجهاز المتاحة من خلال المتصفح.
                    </p>
                    
                    <!-- Agent Status Indicator -->
                    <div style="margin-top: 20px; padding: 15px; background: #f0fdf4; border-radius: 8px; border: 1px solid #bbf7d0; text-align: center;">
                        <div id="agentStatusDisplay" style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                            <span id="agentStatusDot" style="width: 12px; height: 12px; border-radius: 50%; background: #f59e0b; animation: pulse 1.5s infinite;"></span>
                            <span id="agentStatusText" style="font-size: 14px; color: #6b7280;">جاري التحقق من مساعد YAS...</span>
                        </div>
                    </div>
                </div>

                <div class="client-form-container">
                    <form id="clientForm" class="client-form">
                        <div class="form-section">
                            <h2 class="form-section-title">بيانات العميل</h2>
                            
                            <div class="form-group">
                                <label for="customerName" class="form-label">اسم العميل <span class="required">*</span></label>
                                <input type="text" id="customerName" name="customerName" class="form-input" required maxlength="100">
                                <span class="form-error"></span>
                            </div>

                            <div class="form-group">
                                <label for="customerPhone" class="form-label">رقم الهاتف <span class="required">*</span></label>
                                <input type="tel" id="customerPhone" name="customerPhone" class="form-input" required maxlength="20">
                                <span class="form-error"></span>
                            </div>

                            <div class="form-group">
                                <label for="serviceOrder" class="form-label">رقم طلب الصيانة (اختياري)</label>
                                <input type="text" id="serviceOrder" name="serviceOrder" class="form-input" maxlength="50">
                                <span class="form-error"></span>
                            </div>

                            <div class="form-group">
                                <label for="problemDescription" class="form-label">وصف المشكلة <span class="required">*</span></label>
                                <textarea id="problemDescription" name="problemDescription" class="form-textarea" rows="4" required maxlength="500"></textarea>
                                <div class="char-count"><span id="problemDescCount">0</span>/500</div>
                                <span class="form-error"></span>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary btn-lg btn-full">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M10 3v14M3 10h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                                بدء الفحص
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="client-footer">
            <p>&copy; 2026 YAS Laptop Diagnostic System</p>
        </footer>
    </div>

    <!-- Supabase Client (loaded from CDN when configured) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabaseConfig.js"></script>
    <script src="../js/supabaseClient.js"></script>
    <script src="../js/sessionService.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/hardwareAgent.js"></script>
    <script src="../js/agentStateManager.js"></script>
    <script src="../js/client.js"></script>
    <script>
        // BATCH 6B-6: Mandatory Agent detection on client/index.html
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('[Client Index] Page loaded, checking Agent...');
            
            // Update Agent status display
            const updateAgentStatus = (state, message) => {
                const dot = document.getElementById('agentStatusDot');
                const text = document.getElementById('agentStatusText');
                
                if (state === 'CONNECTED') {
                    dot.style.background = '#10b981';
                    dot.style.animation = 'none';
                    text.textContent = '✓ مساعد YAS متصل';
                    text.style.color = '#059669';
                } else if (state === 'DISCONNECTED') {
                    dot.style.background = '#ef4444';
                    dot.style.animation = 'pulse 2s infinite';
                    text.textContent = '✗ مساعد YAS غير متصل';
                    text.style.color = '#dc2626';
                } else if (state === 'CHECKING') {
                    dot.style.background = '#f59e0b';
                    dot.style.animation = 'pulse 1s infinite';
                    text.textContent = 'جاري التحقق من مساعد YAS...';
                    text.style.color = '#6b7280';
                }
            };
            
            // Add CSS animation
            const style = document.createElement('style');
            style.textContent = `
                @keyframes pulse {
                    0%, 100% { opacity: 1; }
                    50% { opacity: 0.5; }
                }
            `;
            document.head.appendChild(style);
            
            // Check Agent status
            console.log('[Agent Status] Checking connection...');
            const agentConnected = await HardwareAgent.detectAgent();
            
            if (agentConnected) {
                console.log('[Agent Status] CONNECTED');
                updateAgentStatus('CONNECTED', 'Agent is ready');
                window.agentPreCheckPassed = true;
            } else {
                console.log('[Agent Status] DISCONNECTED');
                updateAgentStatus('DISCONNECTED', 'Agent not found');
                window.agentPreCheckPassed = false;
            }
            
            const form = document.getElementById('clientForm');
            if (!form) return;

            // Override form submit handler to check Agent first
            const originalSubmitHandler = form.onsubmit;
            
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                console.log('[Client Index] Form submit - checking Agent first');

                // Show checking status
                const submitBtn = form.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                submitBtn.disabled = true;
                submitBtn.innerHTML = 'جاري التحقق من مساعد YAS...';

                try {
                    const agentConnected = await HardwareAgent.detectAgent();
                    
                    if (!agentConnected) {
                        console.log('[Client Index] Agent not connected - redirecting to installation');
                        window.location.href = 'installation-required.html';
                        return;
                    }

                    console.log('[Client Index] Agent connected - setting flag and re-submitting');
                    submitBtn.innerHTML = 'جاري إنشاء الجلسة...';
                    
                    // Set flag to indicate Agent pre-check passed
                    window.agentPreCheckPassed = true;
                    
                    // Re-submit the form (this time it will pass client.js validation)
                    form.dispatchEvent(new Event('submit'));
                } catch (error) {
                    console.error('[Client Index] Agent check error:', error);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                    alert('حدث خطأ أثناء التحقق من مساعد YAS. يرجى المحاولة مجددًا.');
                }
            }, true); // Use capture phase to intercept before client.js handler
        });
    </script>
</body>
</html>
