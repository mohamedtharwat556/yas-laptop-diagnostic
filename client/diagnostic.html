<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAS Laptop Diagnostic - جاري الفحص</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/client.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="client-body">
    <div class="client-container">
        <!-- Header -->
        <header class="client-header">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="4" width="36" height="24" rx="2" stroke="currentColor" stroke-width="2"/>
                    <rect x="6" y="30" width="28" height="4" rx="1" stroke="currentColor" stroke-width="2"/>
                    <rect x="6" y="8" width="28" height="16" rx="1" stroke="currentColor" stroke-width="1.5"/>
                </svg>
                <span class="logo-text">YAS Diagnostic</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="client-main">
            <div class="client-content">
                <div class="diagnostic-header">
                    <h1 class="diagnostic-title">جاري فحص الجهاز</h1>
                    <p class="diagnostic-status" id="diagnosticStatus">جاري تحضير الفحص...</p>
                </div>

                <!-- Hardware Agent Status -->
                <div class="hardware-agent-status" id="hardwareAgentStatus">
                    <div class="agent-status-indicator" id="agentStatusIndicator">
                        <span class="status-dot"></span>
                        <span class="status-text">جاري التحقق من مساعد فحص الجهاز...</span>
                    </div>
                    <div class="agent-status-details" id="agentStatusDetails" style="display: none;">
                        <span class="agent-detail">سيتم استخدام معلومات المتصفح المتاحة</span>
                    </div>
                </div>

                <!-- Device Detection Section -->
                <div class="device-detection-section">
                    <h2 class="section-title">اكتشاف الجهاز</h2>
                    <div class="device-info-grid" id="deviceInfoGrid">
                        <!-- Device info cards will be populated by JavaScript -->
                    </div>
                </div>

                <!-- Tests Section -->
                <div class="tests-section">
                    <h2 class="section-title">الاختبارات</h2>
                    <div class="tests-list" id="testsList">
                        <!-- Test cards will be populated by JavaScript -->
                    </div>
                </div>

                <!-- Interactive Test Container -->
                <div class="interactive-test-container" id="interactiveTestContainer" style="display: none;" tabindex="-1">
                    <div class="interactive-test-header">
                        <h2 class="interactive-test-title" id="interactiveTestTitle">اختبار تفاعلي</h2>
                        <p class="interactive-test-description" id="interactiveTestDescription"></p>
                    </div>
                    <div class="interactive-test-content" id="interactiveTestContent">
                        <!-- Interactive test content will be injected here -->
                    </div>
                    <div class="interactive-test-actions" id="interactiveTestActions">
                        <!-- Test actions will be injected here -->
                    </div>
                </div>

                <!-- Overall Progress -->
                <div class="overall-progress-section">
                    <div class="progress-label">
                        <span>التقدم الكلي</span>
                        <span id="overallProgressText">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="overallProgressFill" style="width: 0%"></div>
                    </div>
                    <div class="network-status" id="networkStatus" style="display: none;">
                        الحالة: <span class="status-text">متصل</span>
                    </div>
                </div>

                <!-- Actions -->
                <div class="diagnostic-actions" id="diagnosticActions" style="display: none;">
                    <button class="btn btn-secondary btn-lg btn-full" id="refreshHardwareBtn">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 4v5h5M16 16v-5h-5M4 4l3 3M16 16l-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        تحديث معلومات الجهاز
                    </button>
                    <button class="btn btn-primary btn-lg btn-full" id="viewResultsBtn">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 10l4 4 8-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        عرض النتائج
                    </button>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="client-footer">
            <p>&copy; 2026 YAS Laptop Diagnostic System</p>
        </footer>
    </div>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabaseConfig.js"></script>
    <script src="../js/supabaseConfig.js"></script>
    <script src="../js/supabaseClient.js"></script>
    <script src="../js/sessionService.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/hardwareAgent.js"></script>
    <script src="../js/keyboard.js"></script>
    <script src="../js/diagnostic.js"></script>
</body>
</html>
