<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BATCH 6B-2b QA Test Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .status-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .status-card {
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            background: #f5f5f5;
            border-left: 4px solid #e0e0e0;
        }

        .status-card.passed {
            background: #e8f5e9;
            border-left-color: #4caf50;
        }

        .status-card.failed {
            background: #ffebee;
            border-left-color: #f44336;
        }

        .status-card.running {
            background: #e3f2fd;
            border-left-color: #2196f3;
        }

        .status-card .number {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .status-card .label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .test-results {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .test-item {
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #e0e0e0;
            background: #f9f9f9;
        }

        .test-item.pass {
            background: #e8f5e9;
            border-left-color: #4caf50;
        }

        .test-item.fail {
            background: #ffebee;
            border-left-color: #f44336;
        }

        .test-item.running {
            background: #e3f2fd;
            border-left-color: #2196f3;
        }

        .test-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .test-icon {
            font-size: 20px;
            width: 24px;
            text-align: center;
        }

        .test-name {
            font-weight: 600;
            color: #333;
        }

        .test-checks {
            margin-left: 34px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
        }

        .check {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .check-icon {
            width: 16px;
            text-align: center;
            font-size: 12px;
        }

        .check-pass .check-icon {
            color: #4caf50;
        }

        .check-fail .check-icon {
            color: #f44336;
        }

        .console-output {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 30px;
        }

        .console-line {
            margin: 3px 0;
            line-height: 1.4;
        }

        .console-pass {
            color: #4caf50;
        }

        .console-fail {
            color: #f44336;
        }

        .console-info {
            color: #2196f3;
        }

        .summary {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
            text-align: center;
        }

        .summary .message {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .summary .details {
            font-size: 13px;
            color: #666;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #667eea;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 BATCH 6B-2b QA Test Suite</h1>
            <p>Hardware Agent Detection + Installation Flow</p>
        </div>

        <div class="content">
            <div class="controls">
                <button class="btn btn-primary" id="runTestsBtn" onclick="startTests()">
                    تشغيل جميع الاختبارات
                </button>
                <button class="btn btn-secondary" id="clearBtn" onclick="clearResults()">
                    مسح النتائج
                </button>
                <span style="margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px;">
                    الحالة:
                    <span id="statusIndicator" style="width: 12px; height: 12px; border-radius: 50%; background: #999; display: inline-block;"></span>
                    <span id="statusText">جاهز</span>
                </span>
            </div>

            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="status-bar">
                <div class="status-card running">
                    <div class="number" id="totalCount">0</div>
                    <div class="label">إجمالي الاختبارات</div>
                </div>
                <div class="status-card passed">
                    <div class="number" id="passCount">0</div>
                    <div class="label">✅ نجح</div>
                </div>
                <div class="status-card failed">
                    <div class="number" id="failCount">0</div>
                    <div class="label">❌ فشل</div>
                </div>
            </div>

            <div class="test-results" id="testResults">
                <p style="text-align: center; color: #999;">اضغط على "تشغيل جميع الاختبارات" للبدء</p>
            </div>

            <div class="summary hidden" id="summary">
                <div class="message" id="summaryMessage"></div>
                <div class="details" id="summaryDetails"></div>
            </div>

            <div class="console-output" id="consoleOutput"></div>
        </div>
    </div>

    <script>
        // Store console logs
        let consoleLogs = [];
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;

        console.log = function(...args) {
            originalLog.apply(console, args);
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg) : String(arg)
            ).join(' ');
            consoleLogs.push({ message, type: 'log' });
            updateConsole();
        };

        console.error = function(...args) {
            originalError.apply(console, args);
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg) : String(arg)
            ).join(' ');
            consoleLogs.push({ message, type: 'error' });
            updateConsole();
        };

        console.warn = function(...args) {
            originalWarn.apply(console, args);
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg) : String(arg)
            ).join(' ');
            consoleLogs.push({ message, type: 'warn' });
            updateConsole();
        };

        function updateConsole() {
            const output = document.getElementById('consoleOutput');
            output.innerHTML = consoleLogs.map(log => {
                let className = 'console-info';
                if (log.type === 'error') className = 'console-fail';
                if (log.type === 'warn') className = 'console-info';
                if (log.message.includes('PASS')) className = 'console-pass';
                if (log.message.includes('FAIL')) className = 'console-fail';

                return `<div class="console-line ${className}">${escapeHtml(log.message)}</div>`;
            }).join('');
            output.scrollTop = output.scrollHeight;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        async function startTests() {
            consoleLogs = [];
            document.getElementById('consoleOutput').innerHTML = '';
            document.getElementById('testResults').innerHTML = '';
            document.getElementById('summary').classList.add('hidden');
            document.getElementById('runTestsBtn').disabled = true;
            document.getElementById('statusIndicator').style.background = '#2196f3';
            document.getElementById('statusText').textContent = 'جاري التشغيل...';

            try {
                // Call QATests.runAll()
                if (typeof QATests !== 'undefined') {
                    const results = await QATests.runAll();
                    displayResults(results);
                } else {
                    throw new Error('QATests not loaded');
                }
            } catch (error) {
                console.error('Test runner error:', error);
                document.getElementById('statusIndicator').style.background = '#f44336';
                document.getElementById('statusText').textContent = 'خطأ';
            } finally {
                document.getElementById('runTestsBtn').disabled = false;
            }
        }

        function displayResults(results) {
            const total = results.length;
            const passed = results.filter(t => t.status === 'PASS').length;
            const failed = results.filter(t => t.status === 'FAIL').length;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('passCount').textContent = passed;
            document.getElementById('failCount').textContent = failed;

            const progressPercent = total > 0 ? (passed / total) * 100 : 0;
            document.getElementById('progressBar').style.width = progressPercent + '%';

            const resultsContainer = document.getElementById('testResults');
            resultsContainer.innerHTML = results.map(test => `
                <div class="test-item ${test.status.toLowerCase()}">
                    <div class="test-header">
                        <span class="test-icon">${test.status === 'PASS' ? '✅' : '❌'}</span>
                        <span class="test-name">${test.name}</span>
                    </div>
                    ${test.checks ? `
                        <div class="test-checks">
                            ${test.checks.map(check => `
                                <div class="check ${check.pass ? 'check-pass' : 'check-fail'}">
                                    <span class="check-icon">${check.pass ? '✓' : '✗'}</span>
                                    <span>${check.name}</span>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                    ${test.error ? `<div style="margin-left: 34px; margin-top: 10px; color: #f44336; font-size: 12px;">Error: ${test.error}</div>` : ''}
                </div>
            `).join('');

            // Show summary
            const summary = document.getElementById('summary');
            summary.classList.remove('hidden');
            const successRate = Math.round((passed / total) * 100);
            document.getElementById('summaryMessage').textContent = 
                failed === 0 ? '🎉 جميع الاختبارات نجحت!' : `⚠️ ${failed} اختبار(ات) فشلت`;
            document.getElementById('summaryDetails').textContent = 
                `${passed}/${total} اختبار نجح (${successRate}%)`;

            // Update status
            const indicator = document.getElementById('statusIndicator');
            const text = document.getElementById('statusText');
            if (failed === 0) {
                indicator.style.background = '#4caf50';
                text.textContent = 'نجح ✓';
            } else {
                indicator.style.background = '#f44336';
                text.textContent = 'فشل ✗';
            }
        }

        function clearResults() {
            consoleLogs = [];
            document.getElementById('testResults').innerHTML = '<p style="text-align: center; color: #999;">اضغط على "تشغيل جميع الاختبارات" للبدء</p>';
            document.getElementById('consoleOutput').innerHTML = '';
            document.getElementById('summary').classList.add('hidden');
            document.getElementById('totalCount').textContent = '0';
            document.getElementById('passCount').textContent = '0';
            document.getElementById('failCount').textContent = '0';
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('statusIndicator').style.background = '#999';
            document.getElementById('statusText').textContent = 'جاهز';
        }
    </script>

    <!-- Load dependencies -->
    <script src="../js/state.js"></script>
    <script src="../js/hardwareAgent.js"></script>
    <script src="../js/agentUI.js"></script>
    <script src="qa-batch-6b-2b.test.js"></script>
</body>
</html>
