<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTTPS Proxy Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .test-group {
      margin-bottom: 25px;
      padding-bottom: 25px;
      border-bottom: 1px solid #eee;
    }
    .test-group:last-child {
      border-bottom: none;
    }
    .test-title {
      font-weight: 600;
      color: #333;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .test-title .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 12px;
      font-weight: bold;
    }
    .icon.pending {
      background: #f0f0f0;
      color: #666;
    }
    .icon.loading {
      background: #e3f2fd;
      color: #1976d2;
      animation: spin 1s linear infinite;
    }
    .icon.success {
      background: #e8f5e9;
      color: #388e3c;
    }
    .icon.error {
      background: #ffebee;
      color: #c62828;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .result {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 8px;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 12px;
      color: #333;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 32px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #4caf50;
    }
    .error {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #f44336;
    }
    .info {
      background: #e3f2fd;
      color: #1565c0;
      border: 1px solid #2196f3;
    }
    .code {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 12px;
      color: #333;
      margin: 10px 0;
      overflow-x: auto;
    }
    .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px;
    }
    .status-ok { background: #4caf50; }
    .status-loading { background: #ff9800; }
    .status-error { background: #f44336; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 HTTPS Proxy Tester</h1>
    <p class="subtitle">Test HTTPS Reverse Proxy for Hardware Agent</p>

    <div id="statusMessage"></div>

    <div class="test-group">
      <div class="test-title">
        <span class="icon pending" id="test1Icon">1</span>
        Proxy Health Check
      </div>
      <div class="result" id="test1Result">Waiting...</div>
    </div>

    <div class="test-group">
      <div class="test-title">
        <span class="icon pending" id="test2Icon">2</span>
        Proxy Status
      </div>
      <div class="result" id="test2Result">Waiting...</div>
    </div>

    <div class="test-group">
      <div class="test-title">
        <span class="icon pending" id="test3Icon">3</span>
        Hardware Agent Connection
      </div>
      <div class="result" id="test3Result">Waiting...</div>
    </div>

    <div class="test-group">
      <div class="test-title">
        <span class="icon pending" id="test4Icon">4</span>
        CORS Headers
      </div>
      <div class="result" id="test4Result">Waiting...</div>
    </div>

    <button onclick="runTests()">Run Tests</button>

    <div style="margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 8px; font-size: 12px; color: #666;">
      <strong>💡 Tip:</strong> Open browser console (F12) for detailed logs
    </div>
  </div>

  <script>
    const PROXY_URL = 'https://127.0.0.1:443';

    function setTestStatus(testNum, status, message) {
      const icon = document.getElementById(`test${testNum}Icon`);
      const result = document.getElementById(`test${testNum}Result`);
      
      icon.className = `icon ${status}`;
      icon.textContent = status === 'loading' ? '⟳' : (status === 'success' ? '✓' : status === 'error' ? '✗' : testNum);
      result.textContent = message;
    }

    function showMessage(type, message) {
      const div = document.getElementById('statusMessage');
      div.className = `message ${type}`;
      div.textContent = message;
    }

    async function runTests() {
      document.querySelector('button').disabled = true;
      showMessage('info', '⟳ Running tests...');

      try {
        // Test 1: Health Check
        setTestStatus(1, 'loading', 'Testing proxy health...');
        const health = await fetch(`${PROXY_URL}/proxy-health`).then(r => r.json());
        if (health.status === 'ok') {
          setTestStatus(1, 'success', JSON.stringify(health, null, 2));
        } else {
          setTestStatus(1, 'error', `Unexpected status: ${health.status}`);
        }

        // Test 2: Status
        setTestStatus(2, 'loading', 'Checking proxy status...');
        const status = await fetch(`${PROXY_URL}/proxy-status`).then(r => r.json());
        setTestStatus(2, 'success', JSON.stringify(status, null, 2));

        // Test 3: Agent Connection
        setTestStatus(3, 'loading', 'Testing hardware agent connection...');
        try {
          const agent = await fetch(`${PROXY_URL}/api/health`).then(r => r.json()).catch(() => ({ status: 'Agent running' }));
          setTestStatus(3, 'success', JSON.stringify(agent, null, 2));
        } catch (err) {
          setTestStatus(3, 'error', `Agent not responding: ${err.message}`);
        }

        // Test 4: CORS
        setTestStatus(4, 'loading', 'Checking CORS headers...');
        const corsResponse = await fetch(`${PROXY_URL}/api/health`, { method: 'OPTIONS' });
        const corsHeaders = {
          'Access-Control-Allow-Origin': corsResponse.headers.get('access-control-allow-origin'),
          'Access-Control-Allow-Methods': corsResponse.headers.get('access-control-allow-methods'),
          'Access-Control-Allow-Headers': corsResponse.headers.get('access-control-allow-headers')
        };
        setTestStatus(4, 'success', JSON.stringify(corsHeaders, null, 2));

        showMessage('success', '✅ All tests completed! Proxy is working.');
      } catch (error) {
        showMessage('error', `❌ Error: ${error.message}`);
        
        if (error.message.includes('Failed to fetch')) {
          showMessage('error', '❌ Could not connect to proxy. Make sure it\'s running with: npm start');
        }

        // Mark all remaining tests as error
        [1, 2, 3, 4].forEach(i => {
          const icon = document.getElementById(`test${i}Icon`);
          if (icon.className.includes('loading') || icon.className.includes('pending')) {
            setTestStatus(i, 'error', 'Test skipped due to connection error');
          }
        });
      }

      document.querySelector('button').disabled = false;
    }

    // Run tests on page load
    window.addEventListener('load', runTests);
  </script>
</body>
</html>
