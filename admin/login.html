<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAS Admin - تسجيل الدخول</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="admin-body">
    <div class="admin-login-container">
        <div class="admin-login-box">
            <div class="admin-login-header">
                <div class="logo">
                    <svg width="48" height="48" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="4" width="36" height="24" rx="2" stroke="currentColor" stroke-width="2"/>
                        <rect x="6" y="30" width="28" height="4" rx="1" stroke="currentColor" stroke-width="2"/>
                        <rect x="6" y="8" width="28" height="16" rx="1" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                </div>
                <h1 class="admin-login-title">YAS Admin</h1>
                <p class="admin-login-subtitle">نظام إدارة فحص الأجهزة</p>
            </div>

            <form id="adminLoginForm" class="admin-login-form">
                <div class="form-group">
                    <label for="adminEmail" class="form-label">البريد الإلكتروني</label>
                    <input type="email" id="adminEmail" name="adminEmail" class="form-input" required>
                    <span class="form-error"></span>
                </div>

                <div class="form-group">
                    <label for="adminPassword" class="form-label">كلمة المرور</label>
                    <input type="password" id="adminPassword" name="adminPassword" class="form-input" required>
                    <span class="form-error"></span>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-lg btn-full">
                        تسجيل الدخول
                    </button>
                </div>
            </form>

            <p class="admin-login-note">
                * للمقاصض التجريبية، استخدم أي بريد إلكتروني وكلمة مرور
            </p>
        </div>
    </div>

    <script src="../js/admin.js"></script>
</body>
</html>
