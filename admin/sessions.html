<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAS Admin - جلسات الفحص</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="admin-body">
    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="4" width="36" height="24" rx="2" stroke="currentColor" stroke-width="2"/>
                        <rect x="6" y="30" width="28" height="4" rx="1" stroke="currentColor" stroke-width="2"/>
                        <rect x="6" y="8" width="28" height="16" rx="1" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    <span class="logo-text">YAS Admin</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="dashboard.html" class="nav-link">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M3 4h14v12H3z" stroke="currentColor" stroke-width="2"/>
                                <path d="M7 16v2h6v-2" stroke="currentColor" stroke-width="2"/>
                            </svg>
                            <span>لوحة التحكم</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link active">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                            <span>جلسات الفحص</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="dashboard.html" class="nav-link" data-page="devices">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="2" y="3" width="16" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
                                <circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="2"/>
                            </svg>
                            <span>الأجهزة</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="dashboard.html" class="nav-link" data-page="customers">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="10" cy="5" r="3" stroke="currentColor" stroke-width="2"/>
                                <path d="M4 17c0-3 2-5 6-5s6 2 6 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                            <span>العملاء</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="dashboard.html" class="nav-link" data-page="reports">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M3 4h14v12H3z" stroke="currentColor" stroke-width="2"/>
                                <path d="M6 8h8M6 11h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                            <span>التقارير</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="dashboard.html" class="nav-link" data-page="settings">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="10" cy="10" r="4" stroke="currentColor" stroke-width="2"/>
                                <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                            <span>الإعدادات</span>
                        </a>
                    </li>
                </ul>
            </nav>
            
            <div class="sidebar-footer">
                <a href="login.html" class="btn btn-secondary btn-sm btn-full">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    تسجيل الخروج
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <button class="menu-toggle" id="menuToggle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <div class="header-title">
                    <h1>جلسات الفحص</h1>
                </div>
                <div class="header-actions">
                    <div class="user-info">
                        <span class="user-name">المشرف</span>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <div class="page-content">
                <div class="dashboard-section">
                    <h2 class="section-title">جميع جلسات الفحص</h2>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>رقم الجلسة</th>
                                    <th>اسم العميل</th>
                                    <th>رقم الهاتف</th>
                                    <th>الحالة</th>
                                    <th>التاريخ</th>
                                    <th>الإجراءات</th>
                                </tr>
                            </thead>
                            <tbody id="allSessionsTable">
                                <tr>
                                    <td colspan="6" class="empty-state">لا توجد جلسات فحص حتى الآن</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/state.js"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabaseClient.js"></script>
    <script src="../js/sessionService.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
